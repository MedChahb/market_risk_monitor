services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mrm
    # Local machine only: not reachable from the rest of the network
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrm -d mrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
