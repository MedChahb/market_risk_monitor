# Lint and tests on every push, against a throwaway PostgreSQL for the database tests.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mrm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mrm -d mrm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
